<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行程後台</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // 先手動初始化，避免自動讀 config 失敗
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.2/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      config: {
        backend: {
          name: "git-gateway",
          branch: "main"
        },
        media_folder: "images/uploads",
        public_folder: "/images/uploads",
        collections: [
          {
            name: "itinerary",
            label: "每日行程",
            folder: "content/itinerary",
            create: true,
            slug: "{{year}}-{{month}}-{{day}}",
            fields: [
              { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false },
              { label: "城市", name: "city", widget: "string" },
              { label: "標題", name: "title", widget: "string" },
              { label: "內容", name: "body", widget: "markdown" }
            ]
          },
          {
            name: "hotels",
            label: "酒店",
            folder: "content/hotels",
            create: true,
            slug: "{{slug}}",
            fields: [
              { label: "名稱", name: "title", widget: "string" },
              { label: "城市", name: "city", widget: "string" },
              { label: "入住", name: "check_in", widget: "string" },
              { label: "退房", name: "check_out", widget: "string" },
              { label: "地址", name: "address", widget: "string" },
              { label: "備註", name: "notes", widget: "text", required: false }
            ]
          }
        ]
      }
    });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
