backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "itinerary"
    label: "每日行程"
    folder: "content/itinerary"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "城市", name: "city", widget: "string" }
      - { label: "標題", name: "title", widget: "string" }
      - { label: "內容", name: "body", widget: "markdown" }

  - name: "hotels"
    label: "酒店"
    folder: "content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "名稱", name: "title", widget: "string" }
      - { label: "城市", name: "city", widget: "string" }
      - { label: "入住", name: "check_in", widget: "string" }
      - { label: "退房", name: "check_out", widget: "string" }
      - { label: "地址", name: "address", widget: "string" }
      - { label: "備註", name: "notes", widget: "text", required: false }
