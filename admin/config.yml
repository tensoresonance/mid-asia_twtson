# Decap CMS — 女朋友用瀏覽器登入後台即可改資料，不用懂 GitHub
# 需在 Netlify 啟用 Identity + Git Gateway

backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hant"

collections:
  - name: "itinerary"
    label: "每日行程"
    label_singular: "一天"
    folder: "content/itinerary"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    fields:
      - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "城市（中文）", name: "city", widget: "string" }
      - { label: "城市（英文）", name: "city_en", widget: "string", required: false }
      - { label: "標題", name: "title", widget: "string" }
      - { label: "重點摘要", name: "summary", widget: "text", required: false }
      - { label: "詳細內容", name: "body", widget: "markdown" }

  - name: "hotels"
    label: "酒店"
    label_singular: "一間酒店"
    folder: "content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "名稱", name: "title", widget: "string" }
      - { label: "城市", name: "city", widget: "string" }
      - { label: "國家", name: "country", widget: "string" }
      - { label: "入住", name: "check_in", widget: "string" }
      - { label: "退房", name: "check_out", widget: "string" }
      - { label: "晚數", name: "nights", widget: "number", value_type: "int", required: false }
      - { label: "地址", name: "address", widget: "string" }
      - { label: "地圖搜尋字", name: "map_query", widget: "string", hint: "貼到 Google 能找到的英文／地址" }
      - { label: "備註", name: "notes", widget: "text", required: false }
      - { label: "內容", name: "body", widget: "markdown", required: false }

  - name: "flights"
    label: "航班"
    label_singular: "一段航班"
    folder: "content/flights"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "日期", name: "date", widget: "string" }
      - { label: "出發", name: "from", widget: "string" }
      - { label: "到達", name: "to", widget: "string" }
      - { label: "航班", name: "flight", widget: "string" }
      - { label: "時間", name: "time", widget: "string" }
      - { label: "飛行時間", name: "duration", widget: "string", required: false }
      - { label: "注意", name: "note", widget: "text", required: false }
