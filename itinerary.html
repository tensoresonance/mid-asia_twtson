  <style>
    .itin-list { display: flex; flex-direction: column; gap: 0.85rem; }
    .itin-day {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .itin-day.is-today {
      border-color: var(--coral);
      background: var(--coral-soft);
    }
    .itin-day .d-date {
      color: var(--coral);
      font-weight: 700;
      font-size: 0.88rem;
      margin: 0 0 0.25rem;
    }
    .itin-day h3 {
      margin: 0 0 0.4rem;
      font-size: 1.05rem;
    }
    .itin-day .d-body {
      margin: 0;
      color: var(--ink);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .itin-day .badge-today {
      display: inline-block;
      margin-left: 0.35rem;
      background: var(--coral);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      vertical-align: middle;
    }
    @media (max-width: 720px) {
      .itin-day { padding: 0.95rem 1rem; }
      .page-hero { padding: 2rem 1rem 1.25rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">

    },
    "2026-10-31": {
      title: "阿拉木圖 · 峽谷與湖一日遊",
      body:
        "GetYourGuide 一日遊：峽谷 + 湖。自備乾糧，行程不包 lunch。<br>" +
        '<a class="act-link" href="https://gyg.me/Q6Q4Uom0" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-01": {
      title: "飛往烏蘭巴托",
      body: "上午退房 → MR412 飛 Ulaanbaatar。入住市中心公寓。"
    },
    "2026-11-02": {
      title: "烏蘭巴托",
      body: "蘇赫巴托爾廣場、國家博物館、市區散步。"
    },
    "2026-11-03": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 1",
      body:
        "沙漠騎馬與騎駱駝 3 日遊（11/3–11/5）開始。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-04": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 2",
      body:
        "沙漠行程第二天（騎馬／駱駝依團安排）。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-05": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 3",
      body:
        "沙漠 3 日遊最後一天，返回烏蘭巴托。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-06": {
      title: "飛往比什凱克",
      body: "UBN → 北京 → BSZ。下午入住 Frunze 公寓。"
    },
    "2026-11-07": {
      title: "比什凱克 · 伊塞克湖與獵鷹 Day 1",
      body:
        "2 日團：Issyk 湖 + 獵鷹（11/7–11/8）第一天。<br>" +
        '<a class="act-link" href="https://gyg.me/t0VudHTz" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-08": {
      title: "比什凱克 · 伊塞克湖與獵鷹 Day 2",
      body:
        "2 日團第二天，返回比什凱克。<br>" +
        '<a class="act-link" href="https://gyg.me/t0VudHTz" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-09": {
      title: "飛塔什干 · Overnight",
      body: "比什凱克 → 塔什干。住 Hampton by Hilton。注意隔日重新托運。"
    },
    "2026-11-10": {
      title: "飛撒馬爾罕",
      body: "上午短程飛 SKD。入住 Zarafshon Parkside。"
    },
    "2026-11-11": {
      title: "撒馬爾罕",
      body: "列吉斯坦、比比哈努姆。"
    },
    "2026-11-12": {
      title: "撒馬爾罕",
      body: "古爾·埃米爾、錫亞布巴扎。"
    },
    "2026-11-13": {
      title: "飛西安 · Overnight",
      body: "撒馬爾罕 → 西安 T5。深夜接機住漢庭。隔日回港。"
    },
    "2026-11-14": {
      title: "回港日",
      body: "CX947 西安 → 香港（公務艙）。"
    }
  };

  function ymd(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  var today = ymd(new Date());
  var list = document.getElementById("itin-list");
  var keys = Object.keys(DAYS).sort();
  var html = "";

  keys.forEach(function (date) {
    var info = DAYS[date];
    var isToday = date === today;
    html +=
      '<article class="itin-day' + (isToday ? " is-today" : "") + '" id="d-' + date + '">' +
      '<p class="d-date">' + date +
      (isToday ? '<span class="badge-today">今天</span>' : "") +
      "</p>" +
      "<h3>" + info.title + "</h3>" +
      '<div class="d-body">' + info.body + "</div>" +
      "</article>";
  });

  list.innerHTML = html;

  if (document.getElementById("d-" + today)) {
    document.getElementById("d-" + today).scrollIntoView({ block: "center" });
  }
})();
  </script>
</body>
</html>
