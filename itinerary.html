<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>完整行程 · 中亞雙人旅行</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/auth-gate.js"></script>
  <style>
    /* 本頁專用：電腦 + 手機 */
    .page-hero {
      padding: 2.5rem 1.25rem 1.5rem;
      text-align: center;
      background: var(--bg-soft, #f7f7f7);
      border-bottom: 1px solid var(--line, #eee);
    }
    .page-hero h1 {
      margin: 0.25rem 0;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
    }
    .page-hero p {
      margin: 0.5rem auto 0;
      color: var(--muted, #666);
      max-width: 28rem;
      font-size: 0.95rem;
    }

    .itin-wrap {
      max-width: 720px;          /* 電腦不要拉太寬，好讀 */
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .itin-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .itin-day {
      background: #fff;
      border: 1px solid var(--line, #eee);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .itin-day.is-today {
      border-color: var(--coral, #e07060);
      background: var(--coral-soft, #fdf0ee);
    }
    .itin-day .d-date {
      color: var(--coral, #e07060);
      font-weight: 700;
      font-size: 0.88rem;
      margin: 0 0 0.3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }
    .itin-day h3 {
      margin: 0 0 0.45rem;
      font-size: 1.08rem;
      line-height: 1.35;
    }
    .itin-day .d-body {
      margin: 0;
      color: var(--ink, #1a1a1a);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .badge-today {
      display: inline-block;
      background: var(--coral, #e07060);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 700;
    }

    /* GetYourGuide 按鈕：電腦與手機都好點 */
    .act-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.75rem;
      padding: 0.7rem 1rem;
      min-height: 44px;
      border-radius: 8px;
      background: var(--coral-soft, #fdf0ee);
      color: var(--coral-hover, #c95a4a) !important;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none !important;
      line-height: 1.3;
      word-break: break-word;
    }
    .act-link:hover {
      background: #f8e4e0;
      color: var(--coral, #e07060) !important;
    }

    @media (max-width: 720px) {
      .site-header {
        padding: 0.85rem 1rem;
      }
      nav {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      nav a {
        white-space: nowrap;
        font-size: 0.88rem;
        padding: 0.35rem 0.6rem;
      }
      .itin-wrap {
        padding: 1.15rem 1rem 2.5rem;
      }
      .itin-day {
        padding: 1rem;
      }
      .act-link {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }

    @media (min-width: 900px) {
      .itin-wrap {
        padding-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">中亞雙人旅行</a>
    <nav>
      <a href="index.html">首頁</a>
      <a href="itinerary.html" class="active">完整行程</a>
      <a href="flights.html">航班</a>
      <a href="hotels.html">酒店</a>
      <a href="stays.html">停留</a>
      <a href="places.html">景點地圖</a>
      <a href="emergency.html">緊急聯絡</a>
      <a href="admin/">後台</a>
    </nav>
  </header>

  <div class="page-hero">
    <h1>完整行程</h1>
    <p>2026.10.29 – 11.14 · 有團的日子可開 GetYourGuide</p>
  </div>

  <main class="itin-wrap">
    <div class="itin-list" id="itin-list">
      <p style="color:#666;text-align:center">載入中…</p>
    </div>
  </main>

  <footer class="site-footer">中亞雙人旅行 · 完整行程</footer>

  <script>
(function () {
  var DAYS = {
    "2026-10-29": {
      title: "出發日 · 飛往阿拉木圖",
      body: "香港 → 成都 → 阿拉木圖。傍晚入住 Samal apartment（16:00 後）。"
    },
    "2026-10-30": {
      title: "阿拉木圖 Day 2",
      body: "建議：中央清真寺、潘菲洛夫公園、綠色巴扎。可依體力安排科克托別。"
    },
    "2026-10-31": {
      title: "阿拉木圖 · 峽谷與湖一日遊",
      body:
        "GetYourGuide 一日遊：峽谷 + 湖。自備乾糧，行程不包 lunch。<br>" +
        '<a class="act-link" href="https://gyg.me/Q6Q4Uom0" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-01": {
      title: "飛往烏蘭巴托",
      body: "上午退房 → MR412 飛 Ulaanbaatar。入住市中心公寓。"
    },
    "2026-11-02": {
      title: "烏蘭巴托",
      body: "蘇赫巴托爾廣場、國家博物館、市區散步。"
    },
    "2026-11-03": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 1",
      body:
        "沙漠騎馬與騎駱駝 3 日遊（11/3–11/5）開始。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-04": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 2",
      body:
        "沙漠行程第二天（騎馬／駱駝依團安排）。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-05": {
      title: "烏蘭巴托 · 沙漠 3 日遊 Day 3",
      body:
        "沙漠 3 日遊最後一天，返回烏蘭巴托。<br>" +
        '<a class="act-link" href="https://gyg.me/ILHcMszq" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-06": {
      title: "飛往比什凱克",
      body: "UBN → 北京 → BSZ。下午入住 Frunze 公寓。"
    },
    "2026-11-07": {
      title: "比什凱克 · 伊塞克湖與獵鷹 Day 1",
      body:
        "2 日團：Issyk 湖 + 獵鷹（11/7–11/8）第一天。<br>" +
        '<a class="act-link" href="https://gyg.me/t0VudHTz" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-08": {
      title: "比什凱克 · 伊塞克湖與獵鷹 Day 2",
      body:
        "2 日團第二天，返回比什凱克。<br>" +
        '<a class="act-link" href="https://gyg.me/t0VudHTz" target="_blank" rel="noopener">打開行程詳情（GetYourGuide）</a>'
    },
    "2026-11-09": {
      title: "飛塔什干 · Overnight",
      body: "比什凱克 → 塔什干。住 Hampton by Hilton。注意隔日重新托運。"
    },
    "2026-11-10": {
      title: "飛撒馬爾罕",
      body: "上午短程飛 SKD。入住 Zarafshon Parkside。"
    },
    "2026-11-11": {
      title: "撒馬爾罕",
      body: "列吉斯坦、比比哈努姆。"
    },
    "2026-11-12": {
      title: "撒馬爾罕",
      body: "古爾·埃米爾、錫亞布巴扎。"
    },
    "2026-11-13": {
      title: "飛西安 · Overnight",
      body: "撒馬爾罕 → 西安 T5。深夜接機住漢庭。隔日回港。"
    },
    "2026-11-14": {
      title: "回港日",
      body: "CX947 西安 → 香港（公務艙）。"
    }
  };

  function ymd(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  var today = ymd(new Date());
  var list = document.getElementById("itin-list");
  var keys = Object.keys(DAYS).sort();
  var html = "";

  keys.forEach(function (date) {
    var info = DAYS[date];
    var isToday = date === today;
    html +=
      '<article class="itin-day' + (isToday ? " is-today" : "") + '" id="d-' + date + '">' +
      '<p class="d-date">' + date +
      (isToday ? '<span class="badge-today">今天</span>' : "") +
      "</p>" +
      "<h3>" + info.title + "</h3>" +
      '<div class="d-body">' + info.body + "</div>" +
      "</article>";
  });

  list.innerHTML = html;

  var el = document.getElementById("d-" + today);
  if (el) {
    setTimeout(function () {
      el.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 200);
  }
})();
  </script>
</body>
</html>
